{% extends "base.html" %}

{% block content %}
<h3>Edit Dashboard</h3>

<form method="POST">
    <!-- Hidden textarea (real form field) -->
    <textarea id="code_editor" name="html_code" style="display:none;">{{ html_code or "" }}</textarea>

    <!-- Visible Ace editor -->
    <div id="editor" style="height:400px; width:100%; border:1px solid #ccc;"></div>

    <br>
    <button type="submit">Save</button>
</form>

<!-- Ace Editor CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const codeField = document.getElementById('code_editor');
    const editorContainer = document.getElementById('editor');

    if (!form || !codeField || !editorContainer) {
        console.error('Missing form, code_editor, or editor element.');
        alert('Editor setup error: required HTML elements are missing.');
        return;
    }

    if (typeof CodeMirror === 'undefined') {
        console.error('CodeMirror library was not loaded.');
        alert('CodeMirror failed to load. Check the script paths.');
        return;
    }

    try {
        const editor = CodeMirror(editorContainer, {
            value: codeField.value || '',
            mode: 'htmlmixed',
            theme: 'monokai',
            lineNumbers: true,
            indentUnit: 2,
            tabSize: 2,
            matchBrackets: true,
            lineWrapping: false
        });

        editor.setSize('100%', '600px');

        form.addEventListener('submit', function (event) {
            codeField.value = editor.getValue();

            if (!codeField.value.trim()) {
                event.preventDefault();
                alert('Cannot save an empty dashboard.');
            }
        });

        console.log('CodeMirror initialized successfully.');
    } catch (error) {
        console.error('Editor initialization failed:', error);
        alert('Editor initialization failed. Check the browser console.');
    }
});
</script>

{% endblock %}
