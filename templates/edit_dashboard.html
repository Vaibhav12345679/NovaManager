{% extends "base.html" %}

{% block content %}
<h3>Edit Dashboard</h3>

<form method="POST">
    <!-- Hidden textarea (real form field) -->
    <textarea id="code_editor" name="html_code" style="display:none;">{{ html_code or "" }}</textarea>

    <!-- Visible Ace editor -->
    <div id="editor" style="height:400px; width:100%; border:1px solid #ccc;"></div>

    <br>
    <button type="submit">Save</button>
</form>

<!-- Ace Editor CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.1/ace.js"></script>

   <script>
const form = document.querySelector('form');
const codeField = document.getElementById('code_editor');
const editorContainer = document.getElementById('editor');

if (!form || !codeField || !editorContainer) {
    console.error('Dashboard editor elements were not found.');
} else if (typeof CodeMirror === 'undefined') {
    console.error('CodeMirror failed to load. Check the script paths.');
    alert('Editor failed to load. Please refresh the page.');
} else {
    const editor = CodeMirror(editorContainer, {
        value: codeField.value || '',
        mode: 'htmlmixed',
        theme: 'monokai',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        matchBrackets: true,
        lineWrapping: false
    });

    editor.setSize('100%', '600px');

    form.addEventListener('submit', function (event) {
        codeField.value = editor.getValue();

        if (!codeField.value.trim()) {
            event.preventDefault();
            alert('Cannot save an empty dashboard.');
        }
    });
}
</script>

{% endblock %}
